<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrameCraft - Personalized Frames & Gifts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-card:hover { transform: translateY(-4px); transition: all 0.3s ease; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased">

    <!-- NAVIGATION BAR -->
    <header class="sticky top-0 z-40 bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <!-- SECRET ADMIN TRIGGER: Click this logo 5 times -->
            <div class="flex items-center space-x-2 cursor-pointer" onclick="triggerAdmin()">
                <i class="fa-solid fa-gift text-amber-400 text-2xl"></i>
                <span class="text-2xl font-extrabold tracking-wide text-white">Frame<span class="text-amber-400">Craft</span></span>
            </div>
            
            <button onclick="toggleCartModal()" class="relative bg-amber-500 hover:bg-amber-600 text-slate-900 px-4 py-2 rounded-lg font-bold flex items-center space-x-2 transition">
                <i class="fa-solid fa-cart-shopping text-lg"></i>
                <span class="hidden sm:inline">Cart</span>
                <span id="cart-count" class="bg-slate-900 text-amber-400 text-xs px-2 py-0.5 rounded-full font-extrabold">0</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- BANNER -->
        <div class="bg-gradient-to-r from-slate-900 to-indigo-900 text-white rounded-2xl p-6 sm:p-10 mb-8 shadow-lg relative overflow-hidden">
            <div class="relative z-10 max-w-xl">
                <span class="bg-amber-400 text-slate-900 text-xs font-black uppercase px-2.5 py-1 rounded">Customized Gifts</span>
                <h1 class="text-3xl sm:text-5xl font-extrabold mt-2 leading-tight">Turn Memories Into Forever Frames</h1>
            </div>
        </div>

        <!-- CATEGORIES FILTER -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-4 mb-6 no-scrollbar" id="category-container">
            <button onclick="filterCategory('All')" class="bg-amber-500 text-slate-900 px-4 py-2 rounded-full text-sm font-bold shadow-sm">All Items</button>
            <button onclick="filterCategory('Wooden Frames')" class="bg-white hover:bg-gray-100 text-gray-700 px-4 py-2 rounded-full text-sm font-medium border">Wooden Frames</button>
            <button onclick="filterCategory('Magic Mugs')" class="bg-white hover:bg-gray-100 text-gray-700 px-4 py-2 rounded-full text-sm font-medium border">Magic Mugs</button>
        </div>

        <!-- PRODUCT GRID -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- SECRET ADMIN PANEL MODAL -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-amber-500 p-4 flex justify-between items-center text-slate-900">
                <h2 class="text-xl font-bold"><i class="fa-solid fa-lock mr-2"></i>Owner Admin Panel</h2>
                <button onclick="toggleAdminModal()" class="text-slate-900 text-2xl font-bold">&times;</button>
            </div>
            
            <div class="p-6 overflow-y-auto">
                <form id="add-product-form" onsubmit="handleAddNewProduct(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700">Product Name</label>
                        <input type="text" id="admin-title" required class="w-full mt-1 p-2 border rounded bg-gray-50 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700">Category</label>
                        <select id="admin-category" class="w-full mt-1 p-2 border rounded bg-gray-50 text-sm">
                            <option value="Wooden Frames">Wooden Frames</option>
                            <option value="Acrylic Frames">Acrylic Frames</option>
                            <option value="Magic Mugs">Magic Mugs</option>
                            <option value="Other Gifts">Other Gifts</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700">Description</label>
                        <textarea id="admin-desc" rows="2" required class="w-full mt-1 p-2 border rounded bg-gray-50 text-sm"></textarea>
                    </div>
                    <div class="flex space-x-2">
                        <div class="w-1/2">
                            <label class="block text-xs font-bold text-gray-700">Size Label</label>
                            <input type="text" id="admin-size" placeholder="e.g. 8x10 Inch" required class="w-full mt-1 p-2 border rounded bg-gray-50 text-sm">
                        </div>
                        <div class="w-1/2">
                            <label class="block text-xs font-bold text-gray-700">Price (₹)</label>
                            <input type="number" id="admin-price" required class="w-full mt-1 p-2 border rounded bg-gray-50 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700">Upload Product Image</label>
                        <input type="file" id="admin-image" accept="image/*" required class="w-full mt-1 p-2 border rounded bg-gray-50 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
                    </div>

                    <button type="submit" id="admin-submit-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-lg text-sm transition mt-4">
                        <i class="fa-solid fa-cloud-arrow-up mr-2"></i>Upload & Add Product
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- CART MODAL (Same as before) -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-sm h-full shadow-2xl flex flex-col justify-between">
            <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                <h2 class="text-lg font-bold">Your Bag</h2>
                <button onclick="toggleCartModal()" class="text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 space-y-4" id="cart-items-container"></div>
            <div class="p-4 border-t bg-gray-50">
                <div class="flex justify-between font-bold text-gray-800 mb-2">
                    <span>Total:</span> <span id="cart-total" class="text-amber-600">₹0</span>
                </div>
                <button onclick="placeWhatsAppOrder()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg flex items-center justify-center space-x-2">
                    <i class="fa-brands fa-whatsapp text-xl"></i><span>Order via WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const MY_WHATSAPP_NUMBER = "9906764541"; 
        const ADMIN_PASSWORD = "owner"; // Change this password!
        const IMGBB_API_KEY = "1e327a3c3d5e278f2cb6ed311e92d6e3"; // Get free key from api.imgbb.com

        // --- DATA ENGINE ---
        // Load products from LocalStorage, or load defaults if empty
        const defaultProducts = [
            { id: 101, title: "Personalized Wooden Frame", category: "Wooden Frames", description: "Teak wood finish.", sizes: [{ label: "8x10 Inch", price: 399 }], image: "https://images.unsplash.com/photo-1582555172866-f73bb12a2ab3?w=500" },
            { id: 102, title: "Custom Magic Mug", category: "Magic Mugs", description: "Black mug reveals photo.", sizes: [{ label: "325ml", price: 299 }], image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500" }
        ];

        let products = JSON.parse(localStorage.getItem('framecraft_db')) || defaultProducts;
        let cart = [];

        // --- FRONTEND ENGINE ---
        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            items.forEach(prod => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow border border-gray-100 flex flex-col justify-between">
                        <div>
                            <img src="${prod.image}" class="w-full h-48 object-cover rounded-t-xl">
                            <div class="p-4">
                                <span class="text-xs font-semibold text-amber-600 bg-amber-50 px-2 py-0.5 rounded">${prod.category}</span>
                                <h3 class="font-bold text-gray-800 text-base mt-1">${prod.title}</h3>
                                <p class="text-gray-500 text-xs mt-1 line-clamp-2">${prod.description}</p>
                                <p class="font-bold text-slate-900 mt-2">₹${prod.sizes[0].price} <span class="text-xs font-normal text-gray-500">(${prod.sizes[0].label})</span></p>
                            </div>
                        </div>
                        <div class="p-4 pt-0">
                            <button onclick="addToCart(${prod.id})" class="w-full bg-slate-900 text-amber-400 font-bold py-2 rounded-lg text-sm flex justify-center items-center gap-2">
                                <i class="fa-solid fa-plus"></i> Add to Cart
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            renderProducts(cat === 'All' ? products : products.filter(p => p.category === cat));
        }

        // --- CART ENGINE ---
        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            cart.push({ title: prod.title, size: prod.sizes[0].label, price: parseInt(prod.sizes[0].price) });
            updateCartUI();
            toggleCartModal(true);
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';
            let total = 0;
            cart.forEach((item, i) => {
                total += item.price;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded border text-sm">
                        <div><p class="font-bold">${item.title}</p><p class="text-amber-600">₹${item.price}</p></div>
                        <button onclick="cart.splice(${i},1); updateCartUI();" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
            });
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-total').innerText = `₹${total}`;
        }

        function toggleCartModal(show = false) {
            const modal = document.getElementById('cart-modal');
            show ? modal.classList.remove('hidden') : modal.classList.toggle('hidden');
        }

        function placeWhatsAppOrder() {
            if(cart.length === 0) return alert("Cart is empty!");
            let itemsText = cart.map((c, i) => `${i+1}. ${c.title} - ₹${c.price}`).join('\n');
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            let msg = `🛒 *NEW ORDER*\n\n*Items:*\n${itemsText}\n\n*Total:* ₹${total}\n\n_I will provide my details now!_`;
            window.open(`https://wa.me/${MY_WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // --- SECRET ADMIN ENGINE ---
        let clickCount = 0;
        let clickTimer;

        function triggerAdmin() {
            clickCount++;
            clearTimeout(clickTimer);
            if (clickCount >= 5) {
                clickCount = 0;
                let pass = prompt("Enter Owner Password to Add Products:");
                if (pass === ADMIN_PASSWORD) {
                    toggleAdminModal();
                } else if(pass !== null) {
                    alert("Incorrect Password!");
                }
            }
            clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
        }

        function toggleAdminModal() {
            document.getElementById('admin-modal').classList.toggle('hidden');
        }

        // --- AUTO IMAGE UPLOAD & SAVE LOGIC ---
        async function handleAddNewProduct(e) {
            e.preventDefault();
            const btn = document.getElementById('admin-submit-btn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Uploading Image...`;
            btn.disabled = true;

            const imageFile = document.getElementById('admin-image').files[0];
            
            // 1. Upload Image to ImgBB (No Backend Required)
            const formData = new FormData();
            formData.append("image", imageFile);
            
            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                const data = await response.json();
                
                if (data.success) {
                    const imageUrl = data.data.url;

                    // 2. Create New Product Object
                    const newProduct = {
                        id: Date.now(),
                        title: document.getElementById('admin-title').value,
                        category: document.getElementById('admin-category').value,
                        description: document.getElementById('admin-desc').value,
                        image: imageUrl,
                        sizes: [{
                            label: document.getElementById('admin-size').value,
                            price: document.getElementById('admin-price').value
                        }]
                    };

                    // 3. Save to Database (LocalStorage for now)
                    products.unshift(newProduct); // Add to top
                    localStorage.setItem('framecraft_db', JSON.stringify(products));

                    // 4. Update UI
                    renderProducts(products);
                    toggleAdminModal();
                    document.getElementById('add-product-form').reset();
                    alert("Product Added Successfully!");
                } else {
                    alert("Failed to upload image.");
                }
            } catch (error) {
                alert("Error uploading image. Check your internet connection.");
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up mr-2"></i>Upload & Add Product`;
                btn.disabled = false;
            }
        }

        // Boot up
        renderProducts(products);
    </script>
</body>
</html>
