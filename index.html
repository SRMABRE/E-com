<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrameCraft - Personalized Frames & Gifts</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-card:hover { transform: translateY(-4px); transition: all 0.3s ease; }
        /* Custom Scrollbar for Cart Drawer & Admin */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        /* Hide scrollbar for categories but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased">

    <!-- NAVIGATION BAR -->
    <header class="sticky top-0 z-40 bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            
            <!-- SECRET ADMIN TRIGGER: Click this logo 5 times -->
            <div class="flex items-center space-x-2 cursor-pointer" onclick="triggerAdmin()" title="Secret Admin Trigger">
                <i class="fa-solid fa-gift text-amber-400 text-2xl"></i>
                <span class="text-2xl font-extrabold tracking-wide text-white">Frame<span class="text-amber-400">Craft</span></span>
            </div>
            
            <!-- Cart Button -->
            <button onclick="toggleCartModal()" class="relative bg-amber-500 hover:bg-amber-600 text-slate-900 px-4 py-2 rounded-lg font-bold flex items-center space-x-2 transition">
                <i class="fa-solid fa-cart-shopping text-lg"></i>
                <span class="hidden sm:inline">Cart</span>
                <span id="cart-count" class="bg-slate-900 text-amber-400 text-xs px-2 py-0.5 rounded-full font-extrabold">0</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- BANNER -->
        <div class="bg-gradient-to-r from-slate-900 to-indigo-900 text-white rounded-2xl p-6 sm:p-10 mb-8 shadow-lg relative overflow-hidden">
            <div class="relative z-10 max-w-xl">
                <span class="bg-amber-400 text-slate-900 text-xs font-black uppercase px-2.5 py-1 rounded">Customized Gifts</span>
                <h1 class="text-3xl sm:text-5xl font-extrabold mt-2 leading-tight">Turn Memories Into Forever Gifts</h1>
                <p class="text-gray-300 text-sm sm:text-base mt-2">Order premium customized photo frames, mugs, and unique gifts directly via WhatsApp.</p>
            </div>
        </div>

        <!-- CATEGORIES FILTER -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-4 mb-6 no-scrollbar">
            <button onclick="filterCategory('All')" class="category-btn bg-amber-500 text-slate-900 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm">All Items</button>
            <button onclick="filterCategory('Wooden Frames')" class="category-btn bg-white hover:bg-gray-100 text-gray-700 px-4 py-2 rounded-full text-sm font-medium border whitespace-nowrap">Wooden Frames</button>
            <button onclick="filterCategory('Acrylic Frames')" class="category-btn bg-white hover:bg-gray-100 text-gray-700 px-4 py-2 rounded-full text-sm font-medium border whitespace-nowrap">Acrylic Frames</button>
            <button onclick="filterCategory('Magic Mugs')" class="category-btn bg-white hover:bg-gray-100 text-gray-700 px-4 py-2 rounded-full text-sm font-medium border whitespace-nowrap">Magic Mugs</button>
            <button onclick="filterCategory('Other Gifts')" class="category-btn bg-white hover:bg-gray-100 text-gray-700 px-4 py-2 rounded-full text-sm font-medium border whitespace-nowrap">Other Gifts</button>
        </div>

        <!-- PRODUCT GRID (AMAZON STYLE) -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic JavaScript Render -->
        </div>
    </main>

    <!-- SECRET ADMIN PANEL MODAL -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            
            <!-- Admin Header -->
            <div class="bg-amber-500 p-4 flex justify-between items-center text-slate-900">
                <h2 class="text-xl font-bold"><i class="fa-solid fa-lock mr-2"></i>Owner Dashboard</h2>
                <button onclick="toggleAdminModal()" class="text-slate-900 text-2xl font-bold">&times;</button>
            </div>

            <!-- Admin Tabs -->
            <div class="flex border-b bg-gray-50 text-sm">
                <button onclick="switchAdminTab('add')" id="tab-add" class="flex-1 py-3 font-bold text-amber-600 border-b-2 border-amber-600 transition">
                    <i class="fa-solid fa-plus mr-1"></i> Add Product
                </button>
                <button onclick="switchAdminTab('orders')" id="tab-orders" class="flex-1 py-3 font-bold text-gray-500 hover:text-amber-600 transition">
                    <i class="fa-solid fa-box-open mr-1"></i> View Orders
                </button>
            </div>
            
            <!-- TAB 1: ADD PRODUCT FORM -->
            <div id="admin-add-section" class="p-6 overflow-y-auto">
                <form id="add-product-form" onsubmit="handleAddNewProduct(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700">Product Name</label>
                        <input type="text" id="admin-title" placeholder="e.g. Couple Watch Set" required class="w-full mt-1 p-2 border rounded bg-white text-sm focus:ring-2 focus:ring-amber-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700">Category</label>
                        <select id="admin-category" class="w-full mt-1 p-2 border rounded bg-white text-sm focus:ring-2 focus:ring-amber-400 outline-none">
                            <option value="Wooden Frames">Wooden Frames</option>
                            <option value="Acrylic Frames">Acrylic Frames</option>
                            <option value="Magic Mugs">Magic Mugs</option>
                            <option value="Other Gifts">Other Gifts</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700">Description</label>
                        <textarea id="admin-desc" rows="2" placeholder="Product details..." required class="w-full mt-1 p-2 border rounded bg-white text-sm focus:ring-2 focus:ring-amber-400 outline-none"></textarea>
                    </div>
                    
                    <!-- Flexible Variant Section -->
                    <div class="flex space-x-2">
                        <div class="w-1/2">
                            <label class="block text-xs font-bold text-gray-700">Variant / Size / Type</label>
                            <input type="text" id="admin-size" placeholder="e.g. Standard, 8x10, Red" required class="w-full mt-1 p-2 border rounded bg-white text-sm focus:ring-2 focus:ring-amber-400 outline-none">
                        </div>
                        <div class="w-1/2">
                            <label class="block text-xs font-bold text-gray-700">Price (₹)</label>
                            <input type="number" id="admin-price" placeholder="e.g. 499" required class="w-full mt-1 p-2 border rounded bg-white text-sm focus:ring-2 focus:ring-amber-400 outline-none">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-gray-700">Upload Product Image</label>
                        <input type="file" id="admin-image" accept="image/*" required class="w-full mt-1 p-2 border rounded bg-gray-50 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
                    </div>

                    <button type="submit" id="admin-submit-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-lg text-sm transition mt-4">
                        <i class="fa-solid fa-cloud-arrow-up mr-2"></i>Upload & Add Product
                    </button>
                </form>
            </div>

            <!-- TAB 2: VIEW ORDERS HISTORY -->
            <div id="admin-orders-section" class="p-6 overflow-y-auto hidden bg-gray-100 flex-1">
                <div id="orders-list-container" class="space-y-4">
                    <!-- Orders will render here dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- CART & CHECKOUT MODAL -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-lg h-full shadow-2xl flex flex-col justify-between overflow-hidden">
            
            <!-- Modal Header -->
            <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                <h2 class="text-lg font-bold"><i class="fa-solid fa-bag-shopping text-amber-400 mr-2"></i> Your Shopping Bag</h2>
                <button onclick="toggleCartModal()" class="text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>

            <!-- Cart Items Container -->
            <div class="p-4 overflow-y-auto flex-1 space-y-4" id="cart-items-container">
                <!-- Cart items load here dynamically -->
            </div>

            <!-- Checkout Form & Summary -->
            <div class="p-4 border-t bg-gray-50 space-y-3">
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between font-bold text-gray-800 text-base">
                        <span>Total Amount:</span>
                        <span id="cart-total" class="text-amber-600">₹0</span>
                    </div>
                </div>

                <!-- Customer Details Form -->
                <form id="checkout-form" onsubmit="handleWhatsAppOrder(event)" class="space-y-2">
                    <input type="text" id="cust-name" placeholder="Full Name *" required class="w-full text-xs p-2.5 border rounded focus:ring-2 focus:ring-amber-400 outline-none">
                    <input type="tel" id="cust-phone" placeholder="WhatsApp Phone Number *" required class="w-full text-xs p-2.5 border rounded focus:ring-2 focus:ring-amber-400 outline-none">
                    <textarea id="cust-address" placeholder="Complete Delivery Address *" rows="2" required class="w-full text-xs p-2.5 border rounded focus:ring-2 focus:ring-amber-400 outline-none"></textarea>
                    <textarea id="cust-custom-text" placeholder="Customization details (e.g. Text/Name to print on product)" rows="2" class="w-full text-xs p-2.5 border rounded focus:ring-2 focus:ring-amber-400 outline-none bg-amber-50"></textarea>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg flex items-center justify-center space-x-2 shadow-md transition">
                        <i class="fa-brands fa-whatsapp text-xl"></i>
                        <span>Place Order via WhatsApp</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT ENGINE -->
    <script>
        // CONFIGURATION
        const MY_WHATSAPP_NUMBER = "919906764541"; 
        const ADMIN_PASSWORD = "owner"; 
        const IMGBB_API_KEY = "1e327a3c3d5e278f2cb6ed311e92d6e3"; 

        // PRODUCT CATALOG DATA
        const defaultProducts = [
            {
                id: 101,
                title: "Personalized Wooden Frame",
                category: "Wooden Frames",
                description: "High quality teak wood finish photo frame with matte print.",
                sizes: [ { label: "8x10 Inch", price: 399 }, { label: "12x18 Inch", price: 599 } ],
                image: "https://images.unsplash.com/photo-1582555172866-f73bb12a2ab3?w=500&q=80"
            },
            {
                id: 102,
                title: "Glossy Acrylic Photo Frame",
                category: "Acrylic Frames",
                description: "Modern frameless 3mm thick glossy acrylic glass print.",
                sizes: [ { label: "8x12 Inch", price: 499 }, { label: "12x18 Inch", price: 799 } ],
                image: "https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=500&q=80"
            },
            {
                id: 103,
                title: "Custom Magic Coffee Mug",
                category: "Magic Mugs",
                description: "Black mug reveals photo when hot liquid is poured into it.",
                sizes: [ { label: "Standard 325ml", price: 299 } ],
                image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&q=80"
            }
        ];

        // Load databases from Local Storage
        let products = JSON.parse(localStorage.getItem('framecraft_db')) || defaultProducts;
        let cart = [];

        // RENDER PRODUCTS TO DOM
        function renderProducts(itemsToRender) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            itemsToRender.forEach(prod => {
                const sizeOptions = prod.sizes.map((s, idx) => 
                    `<option value="${idx}">${s.label} - ₹${s.price}</option>`
                ).join('');

                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden product-card flex flex-col justify-between">
                        <div>
                            <img src="${prod.image}" alt="${prod.title}" class="w-full h-48 object-cover">
                            <div class="p-4">
                                <span class="text-xs font-semibold text-amber-600 bg-amber-50 px-2 py-0.5 rounded">${prod.category}</span>
                                <h3 class="font-bold text-gray-800 text-base mt-1">${prod.title}</h3>
                                <p class="text-gray-500 text-xs mt-1 line-clamp-2">${prod.description}</p>
                                
                                <div class="mt-3">
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">Select Variant/Size:</label>
                                    <select id="size-select-${prod.id}" class="w-full text-xs p-2 border rounded bg-gray-50 focus:outline-none">
                                        ${sizeOptions}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="p-4 pt-0">
                            <button onclick="addToCart(${prod.id})" class="w-full mt-2 bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold py-2 px-4 rounded-lg text-xs flex items-center justify-center space-x-1 transition">
                                <i class="fa-solid fa-plus"></i>
                                <span>Add to Cart</span>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // CATEGORY FILTER LOGIC
        function filterCategory(category) {
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-amber-500', 'text-slate-900', 'shadow-sm');
                btn.classList.add('bg-white', 'text-gray-700');
                if(btn.innerText === category || (category === 'All' && btn.innerText === 'All Items')) {
                    btn.classList.add('bg-amber-500', 'text-slate-900', 'shadow-sm');
                    btn.classList.remove('bg-white', 'text-gray-700');
                }
            });

            if (category === 'All') {
                renderProducts(products);
            } else {
                renderProducts(products.filter(p => p.category === category));
            }
        }

        // ADD TO CART SYSTEM
        function addToCart(productId) {
            const prod = products.find(p => p.id === productId);
            const sizeSelect = document.getElementById(`size-select-${productId}`);
            const selectedSizeIdx = sizeSelect.value;
            const selectedSizeObj = prod.sizes[selectedSizeIdx];

            const cartItemIndex = cart.findIndex(ci => ci.id === productId && ci.size === selectedSizeObj.label);

            if (cartItemIndex > -1) {
                cart[cartItemIndex].quantity += 1;
            } else {
                cart.push({ id: prod.id, title: prod.title, size: selectedSizeObj.label, price: selectedSizeObj.price, quantity: 1 });
            }

            updateCartUI();
            toggleCartModal(true); 
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            const cartCount = document.getElementById('cart-count');
            const cartTotal = document.getElementById('cart-total');

            container.innerHTML = '';
            let total = 0;
            let totalItems = 0;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-10 text-sm">Your cart is empty.</p>`;
            } else {
                cart.forEach((item, index) => {
                    total += item.price * item.quantity;
                    totalItems += item.quantity;

                    container.innerHTML += `
                        <div class="flex justify-between items-center bg-white p-3 rounded-lg border text-xs shadow-sm">
                            <div>
                                <h4 class="font-bold text-gray-800">${item.title}</h4>
                                <p class="text-gray-500">Variant: ${item.size}</p>
                                <p class="font-semibold text-amber-600 mt-1">₹${item.price} x ${item.quantity}</p>
                            </div>
                            <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 text-sm p-2 bg-red-50 rounded-full">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                });
            }

            cartCount.innerText = totalItems;
            cartTotal.innerText = `₹${total}`;
        }

        function toggleCartModal(openForce = false) {
            const modal = document.getElementById('cart-modal');
            if (openForce) modal.classList.remove('hidden');
            else modal.classList.toggle('hidden');
        }

        // WHATSAPP ORDER AUTOMATION & DATABASE SAVING
        function handleWhatsAppOrder(e) {
            e.preventDefault();
            if (cart.length === 0) {
                alert("Your cart is empty! Please add products before placing an order.");
                return;
            }

            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;
            const customText = document.getElementById('cust-custom-text').value || "None";
            const orderId = Math.floor(1000 + Math.random() * 9000); 

            let itemsFormatted = "";
            let grandTotal = 0;

            cart.forEach((item, idx) => {
                const subtotal = item.price * item.quantity;
                grandTotal += subtotal;
                itemsFormatted += `${idx + 1}. ${item.title} (${item.size}) - ₹${item.price} x ${item.quantity}\n`;
            });

            // 1. SAVE ORDER TO ADMIN DATABASE (LOCAL STORAGE)
            const newOrder = {
                id: orderId,
                date: new Date().toLocaleString(),
                name: name,
                phone: phone,
                address: address,
                note: customText,
                items: [...cart],
                total: grandTotal
            };
            
            let savedOrders = JSON.parse(localStorage.getItem('framecraft_orders')) || [];
            savedOrders.unshift(newOrder); // Add to top
            localStorage.setItem('framecraft_orders', JSON.stringify(savedOrders));

            // 2. GENERATE WHATSAPP MESSAGE
            const message = `🛒 *NEW ORDER #${orderId}*

👤 *Customer Details:*
- *Name:* ${name}
- *Phone:* ${phone}
- *Address:* ${address}

📦 *Items Ordered:*
${itemsFormatted}
📝 *Customization Details:*
"${customText}"

💰 *Total Amount:* ₹${grandTotal}

------------------------------
_Please let me know where to send my photos/details!_`;

            // Redirect to WhatsApp
            const encodedMessage = encodeURIComponent(message);
            const whatsappURL = `https://wa.me/${MY_WHATSAPP_NUMBER}?text=${encodedMessage}`;
            window.open(whatsappURL, '_blank');

            // Clear Cart after ordering
            cart = [];
            updateCartUI();
            document.getElementById('checkout-form').reset();
            toggleCartModal(false);
        }

        // --- SECRET ADMIN PANEL ENGINE ---
        let clickCount = 0;
        let clickTimer;

        function triggerAdmin() {
            clickCount++;
            clearTimeout(clickTimer);
            if (clickCount >= 5) {
                clickCount = 0;
                let pass = prompt("Enter Owner Password:");
                if (pass === ADMIN_PASSWORD) {
                    toggleAdminModal();
                    renderAdminOrders(); // Load orders when panel opens
                } else if(pass !== null) {
                    alert("Incorrect Password!");
                }
            }
            clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
        }

        function toggleAdminModal() {
            document.getElementById('admin-modal').classList.toggle('hidden');
        }

        // TAB SWITCHING IN ADMIN PANEL
        function switchAdminTab(tabName) {
            const tabAddBtn = document.getElementById('tab-add');
            const tabOrdersBtn = document.getElementById('tab-orders');
            const secAdd = document.getElementById('admin-add-section');
            const secOrders = document.getElementById('admin-orders-section');

            if(tabName === 'add') {
                secAdd.classList.remove('hidden');
                secOrders.classList.add('hidden');
                tabAddBtn.className = "flex-1 py-3 font-bold text-amber-600 border-b-2 border-amber-600 transition";
                tabOrdersBtn.className = "flex-1 py-3 font-bold text-gray-500 hover:text-amber-600 transition";
            } else {
                secAdd.classList.add('hidden');
                secOrders.classList.remove('hidden');
                tabOrdersBtn.className = "flex-1 py-3 font-bold text-amber-600 border-b-2 border-amber-600 transition";
                tabAddBtn.className = "flex-1 py-3 font-bold text-gray-500 hover:text-amber-600 transition";
                renderAdminOrders();
            }
        }

        // RENDER ORDERS IN ADMIN PANEL
        function renderAdminOrders() {
            const orders = JSON.parse(localStorage.getItem('framecraft_orders')) || [];
            const container = document.getElementById('orders-list-container');
            
            if(orders.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-10"><i class="fa-solid fa-box-open text-4xl mb-3 text-gray-300"></i><p>No orders received yet.</p></div>`;
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-sm relative">
                    <button onclick="deleteOrder(${order.id})" class="absolute top-4 right-4 text-red-400 hover:text-red-600" title="Delete Order">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <div class="flex justify-between items-center border-b pb-2 mb-2">
                        <span class="font-extrabold text-slate-900 bg-amber-100 px-2 py-1 rounded">Order #${order.id}</span>
                        <span class="text-xs text-gray-500 font-medium">${order.date}</span>
                    </div>
                    <div class="space-y-1 mb-3 text-gray-700">
                        <p><i class="fa-solid fa-user text-gray-400 w-5"></i> <span class="font-bold">${order.name}</span></p>
                        <p><i class="fa-brands fa-whatsapp text-emerald-500 w-5"></i> ${order.phone}</p>
                        <p><i class="fa-solid fa-location-dot text-red-400 w-5"></i> ${order.address}</p>
                        ${order.note !== "None" ? `<p class="bg-amber-50 p-2 rounded text-xs border border-amber-100"><i class="fa-solid fa-pen text-amber-600 w-4"></i> <b>Note:</b> ${order.note}</p>` : ''}
                    </div>
                    <div class="bg-gray-50 p-2 rounded border">
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Items Ordered:</p>
                        <ul class="space-y-1">
                            ${order.items.map(i => `<li class="flex justify-between text-xs"><span>${i.quantity}x ${i.title} (${i.size})</span> <span>₹${i.price * i.quantity}</span></li>`).join('')}
                        </ul>
                        <div class="flex justify-between items-center border-t mt-2 pt-2">
                            <span class="font-bold text-slate-900">Total Paid</span>
                            <span class="font-extrabold text-emerald-600 text-base">₹${order.total}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // DELETE ORDER FUNCTION
        function deleteOrder(orderId) {
            if(confirm("Are you sure you want to delete this order history permanently?")) {
                let orders = JSON.parse(localStorage.getItem('framecraft_orders')) || [];
                orders = orders.filter(o => o.id !== orderId);
                localStorage.setItem('framecraft_orders', JSON.stringify(orders));
                renderAdminOrders();
            }
        }

        // Auto Image Upload & Save to Database
        async function handleAddNewProduct(e) {
            e.preventDefault();
            const btn = document.getElementById('admin-submit-btn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Uploading Image...`;
            btn.disabled = true;

            const imageFile = document.getElementById('admin-image').files[0];
            const formData = new FormData();
            formData.append("image", imageFile);
            
            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                const data = await response.json();
                
                if (data.success) {
                    const imageUrl = data.data.url;
                    const newProduct = {
                        id: Date.now(),
                        title: document.getElementById('admin-title').value,
                        category: document.getElementById('admin-category').value,
                        description: document.getElementById('admin-desc').value,
                        image: imageUrl,
                        sizes: [{
                            label: document.getElementById('admin-size').value || 'Standard',
                            price: document.getElementById('admin-price').value
                        }]
                    };

                    products.unshift(newProduct); 
                    localStorage.setItem('framecraft_db', JSON.stringify(products));

                    renderProducts(products);
                    filterCategory('All'); // Reset filter to show new item
                    document.getElementById('add-product-form').reset();
                    alert("Product Added Successfully!");
                    toggleAdminModal();
                } else {
                    alert("Failed to upload image. Please try again.");
                }
            } catch (error) {
                alert("Error uploading image. Check your internet connection.");
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up mr-2"></i>Upload & Add Product`;
                btn.disabled = false;
            }
        }

        // Initial Initialization
        renderProducts(products);
    </script>
</body>
</html>
